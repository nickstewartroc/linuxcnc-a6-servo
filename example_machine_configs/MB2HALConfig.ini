[MB2HAL_INIT]
INIT_DEBUG=1#4
HAL_MODULE_NAME=mb2hal
SLOWDOWN=0.0
TOTAL_TRANSACTIONS=10


# Get Operating State Status
# Page 12-6, 12-7
[TRANSACTION_00]
LINK_TYPE=serial
SERIAL_PORT=/dev/ttyUSB0
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=2
SERIAL_DELAY_MS=3
MB_SLAVE_ID=1

FIRST_ELEMENT=2062
NELEMENTS=1
MB_TX_CODE=fnct_03_read_holding_registers
HAL_TX_NAME=operating-state
MAX_UPDATE_RATE=10.0
DEBUG=0



# Set hz
# 0 - 400, 0.01 resolution
[TRANSACTION_01] 
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=1797
NELEMENTS=1 
HAL_TX_NAME=set-hz
MAX_UPDATE_RATE=0.0 
DEBUG=0

# Set Direction
# 0: Of, 1: FWD, 2: REV
[TRANSACTION_02]
MB_TX_CODE=fnct_06_write_single_register
FIRST_ELEMENT=1798
NELEMENTS=1
HAL_TX_NAME=set-direction
MAX_UPDATE_RATE=0.0
DEBUG=0

# Motor Output Power
# 0.00% - 200.00% 
[TRANSACTION_03]
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=2058
NELEMENTS=1
HAL_TX_NAME=motor-power
MAX_UPDATE_RATE=10.0
DEBUG=0

# Output Frequency
[TRANSACTION_04]
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=2057
NELEMENTS=1
HAL_TX_NAME=output-frequency
MAX_UPDATE_RATE=10.0
DEBUG=0

# Actual Torque
# Range -200.00% - 200.00%
[TRANSACTION_05]
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=2055
NELEMENTS=1
HAL_TX_NAME=actual-torque
MAX_UPDATE_RATE=10.0
DEBUG=0

# Operating Command
# 0: Of, 1: FWD, 2: REV
[TRANSACTION_06]
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=1798
NELEMENTS=1
HAL_TX_NAME=operating-command
MAX_UPDATE_RATE=10.0
DEBUG=0

# Output Current
# 0.00% - 200.00% 
[TRANSACTION_07]
MB_TX_CODE=fnct_03_read_holding_registers
FIRST_ELEMENT=2059
NELEMENTS=1
HAL_TX_NAME=output-current
MAX_UPDATE_RATE=10.0
DEBUG=0

#####
##### Waveshare Modbus RTU IO 8CH
#####

# Read the inputs
[TRANSACTION_08]
LINK_TYPE=serial
SERIAL_PORT=/dev/ttyUSB1
SERIAL_BAUD=9600
SERIAL_BITS=8
SERIAL_PARITY=none
SERIAL_STOP=1
SERIAL_DELAY_MS=10
MB_SLAVE_ID=1

MB_TX_CODE=fnct_02_read_discrete_inputs
FIRST_ELEMENT=0
NELEMENTS=8
HAL_TX_NAME=inputs
PIN_NAMES=carousel-pulse,carousel-index,carousel-in,carousel-out,orient-pin,air-switch,pin7,pin8
MAX_UPDATE_RATE=10.0

# Control the outputs
[TRANSACTION_09]
MB_TX_CODE=fnct_15_write_multiple_coils
FIRST_ELEMENT=0
NELEMENTS=8
HAL_TX_NAME=outputs
PIN_NAMES=carousel-ccw,carousel-cw,carousel-arm,tool-release,orient-pin,mill-enable,mist-coolant,pin8
MAX_UPDATE_RATE=10.0